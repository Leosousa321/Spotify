
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganhe Spotify Premium Grátis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <img src="logo.png" alt="Logo Spotify" class="logo">
        <h1>Ganhe 60 dias grátis de Spotify Premium!</h1>
        <p class="offer-text">Responda a 3 perguntas simples e ganhe 60 dias de Spotify Premium totalmente grátis!</p>
        <div class="question-box" id="question-box">
            <p id="question">Você usa Spotify diariamente?</p>
            <div class="options">
                <button onclick="nextQuestion()">Sim</button>
                <button onclick="nextQuestion()">Não</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
